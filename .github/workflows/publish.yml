name: Publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; never cancel one mid-flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # Everything that can change a rendered figure is pinned: the Quarto
      # version here, the Python version in .python-version, and the exact
      # package versions in uv.lock (installed by `uv sync --locked`, which
      # fails rather than silently re-resolving).
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.10.18

      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true

      - run: uv sync --locked

      - run: quarto render
        env:
          QUARTO_PYTHON: .venv/bin/python

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
