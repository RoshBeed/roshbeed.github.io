project:
  type: website
  output-dir: _site
  # The repo holds no data. This pulls the figures the posts display before
  # anything renders; the notebooks pull their own corpora the same way.
  pre-render:
    - tools/check_isolation.py
    - tools/fetch_figures.py

website:
  title: "Rosh Beed"
  description: "Machine learning and AI solutions engineer, London."
  site-url: https://roshbeed.com
  navbar:
    left:
      - href: index.qmd
        text: Home
      - href: blog.qmd
        text: Blog
      - href: cv.qmd
        text: CV
    right:
      - icon: github
        href: https://github.com/RoshBeed
        aria-label: GitHub
      - icon: linkedin
        href: https://www.linkedin.com/in/roshbeed
        aria-label: LinkedIn

format:
  html:
    theme: cosmo
    css: styles.css
    toc: true
