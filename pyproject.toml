[project]
name = "roshbeed-site"
version = "0.1.0"
description = "roshbeed.com — Quarto site"
requires-python = "==3.13.*"
# Exact versions live in uv.lock; CI installs with `uv sync --locked` so a
# library upgrade can never silently change a rendered figure.
dependencies = [
    "huggingface-hub>=1.32.0",
    "ipykernel",
    "matplotlib",
    "nbclient",
    "nbformat",
    "numpy",
    "pyyaml>=6.0.3",
    "torch>=2.14.0",
    "visualtorch>=1.4.1",
]

# torch comes from the CPU wheel index. The default PyPI wheel bundles CUDA —
# 43 nvidia-* packages and several gigabytes — for toys that only ever run on a
# GitHub runner's CPU. Same pin the residency repo uses.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
    "nbstripout>=0.9.1",
]
